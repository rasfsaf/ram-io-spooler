# Linux Kernel I/O and Dirty Page Cache Tuning for Mechanical HDDs (SATA/SAS)
# Optimized for sequential batch writeback and latency mitigation

# Ratio of dirty memory at which background writeback begins (5%)
vm.dirty_background_ratio = 5

# Maximum ratio of dirty memory before processes are forced to write synchronously (15%)
vm.dirty_ratio = 15

# Dirty page expire interval in centisecs (1500 = 15s)
vm.dirty_expire_centisecs = 1500

# Wakeup interval of kernel flush threads (flusher threads pdflush/kswapd) (500 = 5s)
vm.dirty_writeback_centisecs = 500

# Protect page cache from aggressive inode/dentry eviction
vm.vfs_cache_pressure = 50

# Avoid premature disk thrashing when RAM is available
vm.swappiness = 10
